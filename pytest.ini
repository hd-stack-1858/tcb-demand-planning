[pytest]
markers =
    unit: pure-logic tests, no DB/network — mocks everything, safe to run anywhere.
    integration: hits dev Supabase (TCB_ENV=dev, forced by tests/conftest.py). Never prod.
    integration_mocked: real cross-module code paths (e.g. auth -> session_store -> scraper), only the true external boundary (Supabase, Slack) faked. No credentials needed — safe to run anywhere, like unit.
